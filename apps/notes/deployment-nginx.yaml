apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-nginx
  namespace: notes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-nginx
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: notes-nginx
    spec:
      containers:
      - name: nginx
        image: 10.10.30.70:30500/nginx:1.26.2-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: nginx-config
        configMap:
          name: notes-nginx-config
